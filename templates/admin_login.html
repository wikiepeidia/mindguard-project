{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">

<div class="admin-login-wrapper">
  <div class="admin-login-card" data-aos="fade-up" data-aos-duration="500">

    <div class="text-center mb-4">
      <div class="admin-login-badge">
        <i class="fas fa-lock"></i> Khu vực quản trị
      </div>
      <div class="admin-avatar mx-auto mb-3" style="width:56px;height:56px;border-radius:16px;font-size:1.4rem;">
        <i class="fas fa-user-shield"></i>
      </div>
      <h4 class="fw-bold mb-1">Đăng nhập Admin</h4>
      <p class="text-muted small mb-0">Chỉ dành cho quản trị viên MindGuard</p>
    </div>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label fw-medium small">Email quản trị</label>
        <div class="input-group auth-input-group">
          <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
          <input type="text" class="form-control" name="username"
            placeholder="admin@mindguard.com" required>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-medium small">Mật khẩu</label>
        <div class="input-group auth-input-group">
          <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
          <input type="password" class="form-control" name="password"
            placeholder="••••••••" required>
        </div>
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-dark btn-lg rounded-pill fw-bold auth-submit-btn"
          style="background: linear-gradient(135deg,#1e293b,#334155) !important; box-shadow: 0 4px 16px rgba(15,23,42,0.25);">
          <i class="fas fa-sign-in-alt me-2"></i>Xác thực & Vào hệ thống
        </button>
      </div>
    </form>

    <div class="text-center mt-4">
      <a href="{{ url_for('auth.login') }}" class="small text-muted text-decoration-none opacity-50">
        <i class="fas fa-arrow-left me-1"></i> Về trang đăng nhập người dùng
      </a>
    </div>

  </div>
</div>
{% endblock %}
